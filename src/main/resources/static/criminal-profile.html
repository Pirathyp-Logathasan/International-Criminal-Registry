<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Info</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--CSS-->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">

    <!--JavaScript-->

    <script src="JavaScript/slideshow.js" defer></script>
    <script src="JavaScript/criminal-profile.js" defer></script>


</head>
<body>

<header>
    <h1>CRIMINAL <b>PROFILE</b></h1>
    <img src="Images/White_INTERPOL_Logo.png" alt="INTERPOL-logo">
</header>

<section class="criminal-profile">
    <article>

        <div id="show-Criminal-Profile">
            <h1 id="name"></h1>
            <img id="profileImage" alt="Profile image">

            <p>Nationality: <span id="nationality"></span></p>
            <p>Gender: <span id="gender"></span></p>
            <p>Wanted by: <span id="wantedByCountry"></span></p>
            <p>Charges: <span id="charges"></span></p>

        </div>



    </article>
</section>



</body>
</html>
