<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Info</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--CSS-->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">

    <!--JavaScript-->

    <script src="JavaScript/slideshow.js" defer></script>
    <script src="JavaScript/criminal-profile.js" defer></script>


</head>
<body>

<main>
    <header class="main-header">
        <h1>CRIMINAL <b>PROFILE</b></h1>
        <img src="Images/White_INTERPOL_Logo.png" alt="INTERPOL-logo">
    </header>


<section class="criminal-profile">

    <header class="profile-header">
        <h2>EXTENDED CRIMINAL PROFILE</h2>


        <div class="profile-content">
        <img id="profileImage" alt="Profile image">

        <div class="profile-info">

            <!--Kanskje få til en table her-->
            <table>
                <tr>
                    <th>NAME</th>
                    <td id="name"></td>
                </tr>

                <tr>
                    <th>NATIONALITY</th>
                    <td id="nationality"></td>
                </tr>

                <tr>
                    <th>GENDER</th>
                    <td id="gender"></td>
                </tr>

                <tr>
                    <th>STATUS</th>
                    <td class="wanted">WANTED</td>
                </tr>
            </table>


        </div>
        </div>
    </header>

    <section class="personal-information">
        <h2>PERSONAL INFORMATION</h2>

        <p>Family name: <span id="family-name"></span></p>
        <p>First Name: <span id="first-name"></span> </p>
        <p>Date Of Birth: <span id="dod"></span> </p>
        <p>Nationality: <span id="nationality"></span> </p>
        <p>Gender: <span id="gender"></span></p>
    </section>

    <section class="criminal-information">
        <h2>CRIMINAL INFORMATION</h2>
        <p id="charges">Charges: </p>
        <p id="wantedByCountry">Wanted For Prosecution By:</p>
        <p>Status: Wanted</p>

    </section>

    <section class="additional-information">
        <h2>ADDITIONAL INFORMATION</h2>
        <p>Additional Information: </p>
    </section>
</section>
</main>
</body>
</html>
