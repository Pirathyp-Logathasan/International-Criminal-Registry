<body>
<main>
<section class="criminal-profile">
    <header>
        <h2>EEXTENDED CRIMINAL PROFILE</h2>
    </header>

    <article class="profile-header">
        <img id="profileImage" alt="Profile image">

        <div>
            <h2 id="name"></h2>
            <p>WANTED</p>
            <p id="wantedByCountry">Wanted to serve a sentence by:</p>
        </div>
    </article>

    <section class="personal-information">
        <h2>Personal Information</h2>

    </section>

    <section class="charges">
        <h2>Charges</h2>

    </section>

    <section class="wanted-by">
    <h2>Wanted By</h2>
    </section>

    <section class="additional-information">
        <h2>Additional Information</h2>

    </section>
</section>
</main>






<header>
    <h1>CRIMINAL <b>PROFILE</b></h1>
    <img src="Images/White_INTERPOL_Logo.png" alt="INTERPOL-logo">
</header>
