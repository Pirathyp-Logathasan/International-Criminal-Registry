<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Info</title>

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--CSS-->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="profile.css">

    <!--JavaScript-->

    <script src="JavaScript/slideshow.js" defer></script>
    <script src="JavaScript/criminal-profile.js" defer></script>


</head>
<body>

<main>
    <header>
        <h1>CRIMINAL <b>PROFILE</b></h1>
        <img src="Images/White_INTERPOL_Logo.png" alt="INTERPOL-logo">
    </header>


<section class="criminal-profile">

    <header class="profile-header"> <!--Vurder header eller section for dette, men se senere-->
        <h2>EXTENDED CRIMINAL PROFILE</h2>

        <img id="profileImage" alt="Profile image">
        <p id="name"></p>
        <p>Wanted</p>
        <p>Nationality:</p>
        <p>Gender: </p>
    </header>

    <section class="personal-information">
        <h2>PERSONAL INFORMATION</h2>

        <p>Family name:</p>
        <p>First Name: </p>
        <p>Date Of Birth: </p>
        <p>Nationality: </p>
        <p>Gender:</p>
    </section>

    <section class="criminal-information">
        <h2>CRIMINAL INFORMATION</h2>
        <p>Charges: </p>
        <p id="wantedByCountry">Wanted For Prosecution By:</p>
        <p>Status: Wanted</p>

    </section>

    <section class="additional-information">
        <h2>ADDITIONAL INFORMATION</h2>
        <p>Additional Information: </p>
    </section>
</section>
</main>
</body>
</html>
